# A partir de infra-vps-tecnomovil/plantillas/github-workflow-deploy.yml.
# Flujo: Pruebas -> Imagen (vps-check, hadolint, build, Trivy, prueba de consumo) -> Desplegar -> aviso si falla.
# En un PR solo se prueba; con merge a main, además se publica y se despliega (guia/03-subir-proyecto.md, 3.4).
name: Desplegar
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: desplegar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: pruebas
          POSTGRES_USER: pruebas
          POSTGRES_PASSWORD: pruebas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pruebas" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Pruebas contra Postgres
        env:
          TEST_DATABASE_URL: postgresql://pruebas:pruebas@localhost:5432/pruebas
        run: python -m unittest backend.test_api
      - name: Migraciones aplican en Postgres limpio
        env:
          DATABASE_URL: postgresql://pruebas:pruebas@localhost:5432/pruebas
          JWT_SECRET_KEY: prueba-ci-solo-para-migraciones-0123456789
        run: |
          psql postgresql://pruebas:pruebas@localhost:5432/pruebas -c "drop schema public cascade; create schema public;"
          flask --app backend.app db upgrade

  vps:
    needs: pruebas
    uses: JuanRZAR/infra-vps-tecnomovil/.github/workflows/deploy.yml@v1    # FIJO
    with:
      proyecto: agendamm                            # el nombre en projects.yml
      dockerfile: backend/Dockerfile
      contexto: backend
      ruta_salud: /api/health
      env_prueba: |
        JWT_SECRET_KEY=prueba-ci-sin-secretos-reales-0123456789
      url_salud: https://agendamm.ochylabs.top/api/health
      desplegar: ${{ github.event_name != 'pull_request' }}                   # FIJO
    secrets:                                        # FIJO: uno por uno (secrets: inherit no funciona entre cuentas)
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
