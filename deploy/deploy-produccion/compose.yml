# A partir de infra-vps-tecnomovil/plantillas/deploy-produccion/compose.yml. IMAGE, HOST_PORT y PROYECTO los pone el VPS.
# Reglas en guia/02-preparar-proyecto.md, 2.2; compruébalas con herramientas/vps-check.
services:
  app:
    image: ${IMAGE}                                   # FIJO
    user: "10001:10001"                               # FIJO
    env_file: /srv/apps/${PROYECTO}/.env              # FIJO
    ports:
      - "127.0.0.1:${HOST_PORT}:8000"                 # FIJO: tu app escucha en 8000 dentro del contenedor
    read_only: true                                   # el sistema de archivos de la imagen no se puede modificar
    tmpfs: [/tmp]                                     # único sitio escribible (no guarda archivos: no usa data/)
    pids_limit: 200
    restart: unless-stopped                           # FIJO
    stop_grace_period: 20s
    security_opt: ["no-new-privileges:true"]          # FIJO
    cap_drop: [ALL]                                   # FIJO
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s
    networks: [infra]                                 # Postgres compartido

  migrate:                                            # se ejecuta una vez antes de cada despliegue
    profiles: ["migrate"]                             # FIJO si existe migrate
    image: ${IMAGE}
    user: "10001:10001"
    env_file: /srv/apps/${PROYECTO}/.env
    command: ["flask", "--app", "backend.app", "db", "upgrade"]
    networks: [infra]

networks:
  infra:
    external: true                                    # FIJO
